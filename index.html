<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Schema Playground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 2rem;
    }

    h1 {
      margin-bottom: 1.5rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 1.25rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card h2 {
      margin: 0 0 0.5rem 0;
    }

    .tags {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 1rem;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    button {
      flex: 1;
      padding: 0.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .view { background: #e3f2fd; }
    .click { background: #e8f5e9; }
    .dwell { background: #fff3e0; }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<div id="content-view" style="
  display: none;
  position: fixed;
  inset: 0;
  background: white;
  padding: 2rem;
  z-index: 1000;
">
  <h2 id="content-title"></h2>
  <p id="content-body">Click anywhere to close</p>
</div>

<body>
  <h1>Event Schema Playground</h1>

  <label>
    Event Schema:
    <select id="schema-select"></select>
  </label>

  <pre id="event-preview" style="
    margin: 1rem 0;
    padding: 1rem;
    background: #111;
    color: #0f0;
    max-height: 300px;
    overflow: auto;
  ">
  /* event preview */
  </pre>

  <div id="main-area">

    <!-- Cards -->
    <div id="cards" class="cards">
      <!-- existing cards exactly as you have them -->
    </div>

    <!-- Active content -->
    <div id="content" style="
      display: none;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    ">
      <button id="close-content" style="margin-bottom: 1rem;">
        ← Back
      </button>
      <h2 id="content-title"></h2>
      <p id="content-body"></p>
    </div>

  </div>

  <!-- Main UI logic -->
  <script type="module" src="./main.js"></script>
</body>
</html>

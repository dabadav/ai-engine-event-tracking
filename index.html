<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Schema Playground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    .header {
      background: #1e293b;
      padding: 20px 24px;
      border-bottom: 2px solid #334155;
    }

    .controls {
      margin-top: 12px;
    }

    select {
      padding: 6px 10px;
      border-radius: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      padding: 24px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .overlay.open {
      display: flex;
    }

    .zoom-card {
      background: #020617;
      border-radius: 16px;
      padding: 32px;
      max-width: 600px;
      width: 90%;
    }

    .timer {
      margin-top: 16px;
      padding: 12px;
      background: #1e293b;
      border-radius: 8px;
      font-family: monospace;
      text-align: center;
    }

    button {
      margin-top: 24px;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: #38bdf8;
      cursor: pointer;
    }

    .console {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #020617;
      border-top: 2px solid #334155;
      padding: 12px;
      max-height: 180px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
    }

    .console-line {
      margin: 4px 0;
      padding: 4px 8px;
      border-radius: 4px;
      background: #1e40af;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Event Schema Playground</h1>
    <div class="controls">
      Event schema:
      <select id="schema-select"></select>
    </div>
  </div>

  <div class="grid">
    <div class="card" data-id="c1" data-title="Memorial of Remembrance">
      <h2>Memorial of Remembrance</h2>
    </div>
    <div class="card" data-id="c2" data-title="Voices of the Past">
      <h2>Voices of the Past</h2>
    </div>
    <div class="card" data-id="c3" data-title="Paths Through History">
      <h2>Paths Through History</h2>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="zoom-card">
      <h2 id="zoomTitle"></h2>
      <div class="timer">
        Viewing for <span id="timer">0</span>s
      </div>
      <button id="closeBtn">Close</button>
    </div>
  </div>

  <div class="console" id="console">
    <strong>Event Log</strong>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>

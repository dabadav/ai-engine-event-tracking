  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      background: #f1f5f9;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 14px 20px;
      background: #020617;
      color: #e5e7eb;
      font-size: 16px;
    }

    .container {
      display: flex;
      height: calc(100vh - 52px);
    }

    .left {
      width: 60%;
      padding: 20px;
      overflow-y: auto;
      background: #f8fafc;
    }

    .resizer {
      width: 6px;
      cursor: col-resize;
      background: #94a3b8;
    }

    .right {
      flex: 1;
      padding: 16px;
      background: #020617;
      color: #e5e7eb;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }

    h2 {
      margin-top: 24px;
    }

    .section {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }

    textarea {
      width: 100%;
      min-height: 140px;
      font-family: monospace;
      font-size: 13px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #cbd5f5;
    }

    button {
      margin-top: 8px;
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button.secondary {
      background: #475569;
    }

    .log { color: #93c5fd; }
    .event { color: #86efac; }
    .error { color: #f87171; }
  </style>
</head>

<body>
  <header>
    RudderStack JS SDK – Pro Interactive Demo
  </header>

  <div class="container">
    <!-- LEFT PANEL -->
    <div class="left">
      <div class="section">
        <h2>identify()</h2>
        <textarea id="identifyPayload">
{
  "userId": "user_123",
  "traits": {
    "name": "Jane Doe",
    "email": "jane@example.com",
    "plan": "Pro"
  }
}
        </textarea>
        <button onclick="sendIdentify()">Send identify()</button>
      </div>

      <div class="section">
        <h2>track()</h2>
        <textarea id="trackPayload">
{
  "event": "Product Added",
  "properties": {
    "product_id": "sku_001",
    "price": 29.99,
    "currency": "USD"
  }
}
        </textarea>
        <button onclick="sendTrack()">Send track()</button>
      </div>

      <div class="section">
        <h2>group()</h2>
        <textarea id="groupPayload">
{
  "groupId": "org_456",
  "traits": {
    "name": "Acme Corp",
    "industry": "SaaS"
  }
}
        </textarea>
        <button onclick="sendGroup()">Send group()</button>
      </div>

      <div class="section">
        <h2>consent()</h2>
        <textarea id="consentPayload">
{
  "consentManagement": {
    "allowedConsentIds": ["analytics"],
    "deniedConsentIds": []
  }
}
        </textarea>
        <button onclick="sendConsent()">Send consent()</button>
      </div>

      <div class="section">
        <button class="secondary" onclick="handleReset()">reset()</button>
        <button class="secondary" onclick="showAnon()">getAnonymousId()</button>
        
      </div>
    </div>

    <!-- RESIZER -->
    <div class="resizer" id="resizer"></div>

    <!-- RIGHT PANEL -->
    <div class="right" id="debug"></div>
  </div>

  <script>
    const debugEl = document.getElementById("debug");

    function log(type, title, payload) {
      const ts = new Date().toISOString();
      debugEl.innerHTML +=
        `[${ts}] <span class="${type}">${title}</span>\n` +
        (payload ? JSON.stringify(payload, null, 2) + "\n\n" : "\n");
      debugEl.scrollTop = debugEl.scrollHeight;
    }

    function parse(id) {
      try {
        return JSON.parse(document.getElementById(id).value);
      } catch (e) {
        log("error", "Invalid JSON", e.message);
        throw e;
      }
    }

    function sendIdentify() {
      const p = parse("identifyPayload");
      rudderanalytics.identify(p.userId, p.traits);
      log("event", "identify()", p);
    }

    function sendTrack() {
      const p = parse("trackPayload");
      rudderanalytics.track(p.event, p.properties);
      log("event", "track()", p);
    }

    function sendGroup() {
      const p = parse("groupPayload");
      rudderanalytics.group(p.groupId, p.traits);
      log("event", "group()", p);
    }

    function sendConsent() {
      const p = parse("consentPayload");
      rudderanalytics.consent(p);
      log("event", "consent()", p);
    }

    function showAnon() {
      log("log", "Anonymous ID", rudderanalytics.getAnonymousId());
    }

    function handleReset() {
      // 1. Clear existing user data (userId and traits)
      rudderanalytics.reset();

      // 2. Manually generate a new unique ID
      // Using crypto.randomUUID() is the modern way to get a valid UUID string
      const newId = crypto.randomUUID();

      // 3. Force the SDK to use it
      rudderanalytics.setAnonymousId(newId);

      // 4. Log it immediately
      log("log", "Manual Reset Successful", "ID forced to: " + newId);
    }

    rudderanalytics.ready(() => log("log", "SDK ready"));

    /* --- Resizer logic --- */
    const resizer = document.getElementById("resizer");
    const left = document.querySelector(".left");

    let isDragging = false;

    resizer.addEventListener("mousedown", () => {
      isDragging = true;
      document.body.style.cursor = "col-resize";
    });

    document.addEventListener("mousemove", e => {
      if (!isDragging) return;
      left.style.width = e.clientX + "px";
    });

    document.addEventListener("mouseup", () => {
      isDragging = false;
      document.body.style.cursor = "default";
    });
  </script>
</body>
</html>
